<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서해 중부 통합 도선 스케줄</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#1d4ed8" />
  <script>
    (function () {
      try {
        var v = localStorage.getItem("pilot-theme");
        var dark = v === "dark" || (v !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>
  <style>
    /* ===== 색상 설정: 라이트(기본) / 다크 =====
       화면 모드는 <html data-theme="light|dark"> 로 정해지고, 오른쪽 위 버튼으로 바꿀 수 있습니다. */
    :root {
      color-scheme: light;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --surface-1: #f9fafb;
      --surface-2: #f3f4f6;
      --surface-3: #f8fafc;
      --text-main: #111827;
      --text-sub: #4b5563;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --primary: #1d4ed8;
      --link: #1d4ed8;
      --btn-bg: #ffffff;
      --input-bg: #ffffff;
      --shadow: rgba(0, 0, 0, 0.05);
      --shadow-strong: rgba(0, 0, 0, 0.08);
      --overlay: rgba(15, 23, 42, 0.5);

      --incheon-bg: #fce7f3;
      --incheon-text: #be185d;
      --pyeongtaek-bg: #efe2d2;
      --pyeongtaek-text: #6b3f1d;
      --daesan-bg: #dcfce7;
      --daesan-text: #166534;
      --boryeong-bg: #e0f2fe;
      --boryeong-text: #075985;

      --big-bg: #fca5a5;
      --big-bar: #b91c1c;
      --transit-bg: #7c3aed;

      --soon-bg: #fef9c3;
      --soon-chip-bg: #fde047;
      --soon-chip-text: #111827;
      --past-bg: #f3f4f6;
      --date-bg: #eef2ff;
      --date-text: #3730a3;
      --head-bg: #1e293b;
      --head-text: #ffffff;
      --all-bg: #e2e8f0;
      --all-text: #1e293b;

      --err-bg: #fef2f2;
      --err-border: #fecaca;
      --err-text: #991b1b;
      --err-bar: #dc2626;

      /* 대산항 조석표 */
      --tc-bg: #f8fafc;
      --tc-text: #0f172a;
      --tc-sub: #475569;
      --tc-line: #2563eb;
      --tc-grid: rgba(100, 116, 139, 0.28);
      --tc-now: #ea580c;
      --tc-vessel: #4f46e5;
      --tc-border: #e2e8f0;
      --tc-chip: #eef2ff;
      --tc-red: #dc2626;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg-color: #0b1220;
      --card-bg: #141c2e;
      --surface-1: #182238;
      --surface-2: #1e293b;
      --surface-3: #172033;
      --text-main: #e5e7eb;
      --text-sub: #a3adbd;
      --text-muted: #94a3b8;
      --border-color: #2b374d;
      --primary: #2563eb;
      --link: #93c5fd;
      --btn-bg: #141c2e;
      --input-bg: #0f1727;
      --shadow: rgba(0, 0, 0, 0.4);
      --shadow-strong: rgba(0, 0, 0, 0.5);
      --overlay: rgba(0, 0, 0, 0.65);

      --incheon-bg: #4c1d38;
      --incheon-text: #f9a8d4;
      --pyeongtaek-bg: #44321f;
      --pyeongtaek-text: #f0cfa5;
      --daesan-bg: #143823;
      --daesan-text: #86efac;
      --boryeong-bg: #0e3350;
      --boryeong-text: #7dd3fc;

      --big-bg: #991b1b;
      --big-bar: #fca5a5;
      --transit-bg: #8b5cf6;

      --soon-bg: #4a3f0a;
      --soon-chip-bg: #ca8a04;
      --soon-chip-text: #111827;
      --past-bg: #1a2336;
      --date-bg: #1f2a4d;
      --date-text: #a5b4fc;
      --head-bg: #0f172a;
      --head-text: #e5e7eb;
      --all-bg: #243049;
      --all-text: #e2e8f0;

      --err-bg: #3a1517;
      --err-border: #7f1d1d;
      --err-text: #fecaca;
      --err-bar: #f87171;

      --tc-bg: #0f172a;
      --tc-text: #e2e8f0;
      --tc-sub: #94a3b8;
      --tc-line: #60a5fa;
      --tc-grid: rgba(148, 163, 184, 0.28);
      --tc-now: #fb923c;
      --tc-vessel: #a5b4fc;
      --tc-border: #334155;
      --tc-chip: #1e293b;
      --tc-red: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    }

    html {
      background-color: var(--bg-color);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .update-info {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .refresh-btn {
      padding: 6px 10px;
      border: 1px solid var(--border-color);
      background: var(--btn-bg);
      color: var(--link);
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .refresh-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* 원본 사이트 오류 경고 */
    .error-banner {
      display: none;
      background: var(--err-bg);
      border: 1px solid var(--err-border);
      border-left: 4px solid var(--err-bar);
      color: var(--err-text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .error-banner .eb-detail {
      display: block;
      margin-top: 2px;
      font-size: 0.76rem;
      font-weight: 500;
      opacity: 0.85;
    }

    .controls {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 1px 3px var(--shadow);
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      background: var(--btn-bg);
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .search-box {
      display: flex;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      background: var(--input-bg);
      color: var(--text-main);
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      margin-right: 6px;
      vertical-align: middle;
    }

    .badge-인천 { background: var(--incheon-bg); color: var(--incheon-text); }
    .badge-평택 { background: var(--pyeongtaek-bg); color: var(--pyeongtaek-text); }
    .badge-대산 { background: var(--daesan-bg); color: var(--daesan-text); }
    .badge-보령 { background: var(--boryeong-bg); color: var(--boryeong-text); }

    /* 통과선박 표시 (도선점 위) */
    .transit-badge {
      display: inline-block;
      background: var(--transit-bg);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 4px;
      white-space: nowrap;
    }

    /* ===== 상세 목록 (대산 / 보령 / 전체) ===== */
    .detail-wrap {
      display: none;
    }

    .dt-legend {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .dt-card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 1px 3px var(--shadow-strong);
      overflow: clip;
    }

    .dt-title {
      padding: 12px 16px;
      font-size: 1.15rem;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dt-title small {
      font-size: 0.9rem;
      font-weight: 700;
      opacity: 0.85;
    }

    .dt-title-daesan { background: var(--daesan-bg); color: var(--daesan-text); }
    .dt-title-boryeong { background: var(--boryeong-bg); color: var(--boryeong-text); }
    .dt-title-all { background: var(--all-bg); color: var(--all-text); }

    .dt {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .dt thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--head-bg);
      color: var(--head-text);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 10px 10px;
      white-space: nowrap;
    }

    .dt th.num,
    .dt td.num {
      text-align: right;
    }

    .dt td {
      padding: 12px 10px;
      font-size: 1rem;
      border-top: 1px solid var(--border-color);
      vertical-align: middle;
    }

    .dt tr.date-row td {
      background: var(--date-bg);
      color: var(--date-text);
      font-weight: 800;
      font-size: 0.9rem;
      padding: 8px 14px;
    }

    .c-pilot {
      font-weight: 700;
      white-space: nowrap;
    }

    .c-vessel {
      font-size: 1.1rem;
      font-weight: 800;
      line-height: 1.3;
      word-break: break-word;
    }

    .c-time {
      font-size: 1.3rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .c-route {
      font-weight: 700;
      color: var(--text-main);
    }

    .rt-from,
    .rt-to {
      display: inline;
    }

    .c-call {
      font-family: monospace;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    .c-agent {
      font-size: 0.92rem;
      color: var(--text-main);
    }

    .c-ton {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .dt tr.row.past td {
      opacity: 0.5;
      background: var(--past-bg);
    }

    .dt tr.row.soon td {
      background: var(--soon-bg);
    }

    /* 대산 15만톤 이상: 스케줄 배경색을 눈에 띄게 강조 (과거/1시간 이내 색보다 우선) */
    .dt tr.row.big td {
      background: var(--big-bg);
      opacity: 1;
    }

    .dt tr.row.soon .c-time {
      background: var(--soon-chip-bg);
      color: var(--soon-chip-text);
      border-radius: 6px;
      padding: 0 6px;
      display: inline-block;
    }

    .p-인천 { --bar: var(--incheon-text); }
    .p-평택 { --bar: var(--pyeongtaek-text); }
    .p-대산 { --bar: var(--daesan-text); }
    .dt tr.row.big { --bar: var(--big-bar); }

    @media (min-width: 701px) {
      .dt tr.row td:first-child {
        border-left: 6px solid var(--bar);
      }

      .dt tr.row.big td:first-child {
        border-left-width: 10px;
      }
    }

    /* 누르면 상세정보가 뜨는 항목 (대산만) */
    [data-ref] {
      cursor: pointer;
    }

    .dt tr.row[data-ref]:hover td {
      filter: brightness(0.97);
    }

    .dt-empty {
      padding: 32px 16px;
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-sub);
    }

    /* ===== 요약 보기 (컴퓨터: 3칸 나란히) ===== */
    .summary-note {
      display: none;
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .summary-grid {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      align-items: start;
    }

    .sum-col {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 1px 3px var(--shadow);
      overflow: hidden;
    }

    .sum-head {
      padding: 10px 12px;
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sum-head small {
      font-size: 0.75rem;
      font-weight: 600;
      opacity: 0.8;
    }

    .sum-head-인천 { background: var(--incheon-bg); color: var(--incheon-text); }
    .sum-head-평택 { background: var(--pyeongtaek-bg); color: var(--pyeongtaek-text); }
    .sum-head-대산 { background: var(--daesan-bg); color: var(--daesan-text); }

    .sum-item {
      padding: 8px 12px;
      border-top: 1px solid var(--border-color);
    }

    .sum-item.big {
      background: var(--big-bg);
      border-left: 6px solid var(--big-bar);
    }

    .sum-line1 {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .sum-vessel {
      font-weight: 700;
      font-size: 0.9rem;
      word-break: break-word;
    }

    .sum-time {
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .sum-station {
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-top: 2px;
      word-break: break-word;
    }

    .sum-item.big .sum-station {
      color: var(--text-main);
    }

    .sum-ton {
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
    }

    .sum-empty {
      padding: 16px 12px;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .sum-item .transit-badge,
    .tl-item .transit-badge {
      font-size: 0.64rem;
      padding: 1px 6px;
      margin-bottom: 2px;
    }

    /* ===== 요약 보기 (폰: 시간대별 표) ===== */
    .tl-grid {
      display: grid;
      grid-template-columns: 38px 1fr 1fr 1fr;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 1px 3px var(--shadow);
      overflow: clip;
    }

    .tl-head {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 8px 2px;
      font-size: 0.8rem;
      font-weight: 700;
      text-align: center;
    }

    .tl-head small {
      display: block;
      font-size: 0.65rem;
      font-weight: 600;
      opacity: 0.8;
    }

    .tl-head-time {
      background: var(--surface-2);
      color: var(--text-sub);
    }

    .tl-date {
      grid-column: 1 / -1;
      padding: 4px 10px;
      background: var(--date-bg);
      color: var(--date-text);
      font-size: 0.75rem;
      font-weight: 700;
      border-top: 1px solid var(--border-color);
    }

    .tl-hour {
      padding: 6px 2px;
      font-size: 0.75rem;
      font-weight: 700;
      text-align: center;
      color: var(--text-sub);
      background: var(--surface-1);
      border-top: 1px solid var(--border-color);
    }

    .tl-cell {
      padding: 5px 5px;
      border-top: 1px solid var(--border-color);
      border-left: 1px solid var(--border-color);
      min-width: 0;
    }

    .tl-item + .tl-item {
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px dashed var(--border-color);
    }

    .tl-item.big {
      background: var(--big-bg);
      border-left: 5px solid var(--big-bar);
      padding-left: 3px;
      border-radius: 4px;
    }

    .tl-item.big .tl-st,
    .tl-item.big .tl-min {
      color: var(--text-main);
    }

    .tl-min {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    .tl-name {
      font-size: 0.74rem;
      font-weight: 700;
      line-height: 1.25;
      word-break: break-word;
    }

    .tl-st {
      font-size: 0.64rem;
      color: var(--text-sub);
      line-height: 1.25;
      word-break: break-word;
    }

    .tl-ton {
      font-size: 0.66rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
    }

    .tl-empty {
      grid-column: 1 / -1;
      padding: 24px 12px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    /* ===== 상세정보 창 ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--card-bg);
      color: var(--text-main);
      width: 100%;
      max-width: 520px;
      max-height: 88vh;
      overflow: auto;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .dm-head {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--card-bg);
      padding: 16px 16px 10px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .dm-title {
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1.25;
      word-break: break-word;
    }

    .dm-tags {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .dm-tags .transit-badge {
      margin-bottom: 0;
    }

    .dm-close {
      border: 0;
      background: var(--surface-2);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      flex: none;
    }

    .dm-key {
      padding: 14px 16px;
      background: var(--surface-3);
      border-bottom: 1px solid var(--border-color);
    }

    /* 15만톤 이상 선박은 도선시간 블록 배경도 강조 */
    .dm-key.big {
      background: var(--big-bg);
      border-left: 8px solid var(--big-bar);
    }

    .dm-key.big .dm-date {
      color: var(--text-main);
    }

    .dm-time {
      font-size: 1.9rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .dm-date {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 700;
    }

    .dm-route {
      margin-top: 4px;
      font-size: 1.15rem;
      font-weight: 800;
      word-break: break-word;
    }

    .dm-tide {
      padding: 12px 16px 4px;
    }

    .dm-body {
      padding: 4px 16px 18px;
    }

    .dm-row {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .dm-row:last-child {
      border-bottom: 0;
    }

    .dm-l {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    .dm-v {
      font-size: 1rem;
      font-weight: 700;
      word-break: break-word;
    }

    /* ===== 대산항 조석표 카드 ===== */
    .tide-card {
      background: var(--tc-bg);
      color: var(--tc-text);
      border: 1px solid var(--tc-border);
      border-radius: 12px;
      padding: 12px;
    }

    .tc-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--tc-text);
    }

    .dm-tide .tc-title,
    .tc-ves-text {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px 8px;
    }

    .tc-state-badge,
    .tc-low-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--tc-red) 10%, transparent);
      color: var(--tc-red);
      font-size: 0.7rem;
      font-weight: 800;
      line-height: 1.3;
      white-space: nowrap;
    }

    .tc-low-badge {
      background: color-mix(in srgb, var(--tc-red) 15%, transparent);
    }

    .tc-note {
      margin-top: 2px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--tc-sub);
    }

    .tc-chip {
      margin-top: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--tc-chip);
      color: var(--tc-text);
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.35;
    }

    /* 상승(창조) / 하강(낙조) 글자 강조 */
    .tc-red {
      color: var(--tc-red);
      font-weight: 800;
    }

    .tc-ves-text {
      margin-top: 6px;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--tc-now);
    }

    .tc-chart {
      margin-top: 6px;
      width: 100%;
    }

    .tc-svg {
      display: block;
      width: 100%;
    }

    .tc-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 12px;
      border: 1px dashed var(--tc-border);
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--tc-sub);
    }

    .tc-foot {
      margin-top: 6px;
      font-size: 0.7rem;
      color: var(--tc-sub);
      line-height: 1.4;
    }

    .tc-two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .tc-sum {
      min-width: 0;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--tc-chip);
    }

    .tc-l {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--tc-sub);
    }

    .tc-time {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--tc-sub);
      font-variant-numeric: tabular-nums;
    }

    .tc-big {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.1;
      color: var(--tc-text);
      font-variant-numeric: tabular-nums;
    }

    .tc-big small {
      font-size: 0.9rem;
      font-weight: 700;
      margin-left: 2px;
    }

    .tc-big-na {
      font-size: 1.1rem;
      padding: 6px 0;
      color: var(--tc-sub);
    }

    .tc-state {
      margin-top: 2px;
      font-size: 1.05rem;
      font-weight: 800;
    }

    .tc-next {
      margin-top: 4px;
      font-size: 0.74rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--tc-text);
    }

    .tc-next span {
      font-weight: 600;
      color: var(--tc-sub);
    }

    .tc-svg .tc-low-window { fill: var(--tc-red); fill-opacity: 0.085; }
    .tc-svg .tc-low-window-label { fill: var(--tc-red); fill-opacity: 0.82; font-size: 9px; font-weight: 700; }
    .tc-svg .tc-grid { stroke: var(--tc-grid); stroke-width: 1; }
    .tc-svg .tc-vgrid { stroke: var(--tc-grid); stroke-width: 1; opacity: 0.55; }
    .tc-svg .tc-ax { fill: var(--tc-sub); font-size: 10.5px; }
    .tc-svg .tc-curve { fill: none; stroke: var(--tc-line); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .tc-svg .tc-dot { fill: var(--tc-line); stroke: var(--tc-bg); stroke-width: 1.5; }
    .tc-svg .tc-val { fill: var(--tc-text); font-size: 11px; font-weight: 800; }
    .tc-svg .tc-ptime { fill: var(--tc-sub); font-size: 10px; font-weight: 700; }
    .tc-svg .tc-now-line { stroke: var(--tc-now); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .tc-svg .tc-now-dot { fill: var(--tc-now); stroke: var(--tc-bg); stroke-width: 2; }
    .tc-svg .tc-now-lbl { fill: var(--tc-now); font-size: 11px; font-weight: 800; }
    .tc-svg .tc-ves-line { stroke: var(--tc-vessel); stroke-width: 2; }
    .tc-svg .tc-ves-mark { fill: var(--tc-vessel); stroke: var(--tc-bg); stroke-width: 1.5; }
    .tc-svg .tc-ves-lbl { fill: var(--tc-vessel); font-size: 11px; font-weight: 800; }

    /* 목록 화면: "대산 24건" 바 아래 한 줄 요약 (누르면 그래프 펼침) */
    .tide-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      background: var(--tc-bg);
      color: var(--tc-text);
      border-bottom: 1px solid var(--tc-border);
      cursor: pointer;
    }

    .tide-bar-off {
      cursor: default;
      font-size: 0.8rem;
      color: var(--tc-sub);
    }

    .tide-bar-t {
      flex: none;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .tide-bar-chip {
      flex: 1;
      min-width: 0;
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .tide-bar-arrow {
      flex: none;
      font-size: 0.8rem;
      color: var(--tc-sub);
    }

    .tide-panel {
      display: none;
      padding: 10px 12px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }

    @media (max-width: 700px) {
      .summary-grid {
        grid-template-columns: 1fr;
      }

      .modal-overlay {
        align-items: flex-end;
        padding: 0;
      }

      .modal-sheet {
        max-width: none;
        max-height: 90vh;
        border-radius: 16px 16px 0 0;
      }

      /* 상세 목록: 폰에서는 카드형 (왼쪽: 시간 + 도선점) */
      .dt thead {
        display: none;
      }

      .dt,
      .dt tbody {
        display: block;
      }

      .dt tr.date-row {
        display: block;
      }

      .dt tr.date-row td {
        display: block;
      }

      .dt tr.row {
        display: grid;
        grid-template-columns: 104px 1fr 1fr;
        grid-template-areas:
          "time vessel vessel"
          "route pilot call"
          "route agent ton";
        gap: 6px 10px;
        padding: 12px 12px 12px 10px;
        border-top: 1px solid var(--border-color);
        border-left: 6px solid var(--bar);
      }

      .dt tr.row.big {
        border-left-width: 10px;
      }

      .dt tr.row td {
        display: block;
        padding: 0;
        border: 0;
        background: transparent;
        min-width: 0;
      }

      .dt tr.row.past {
        opacity: 0.5;
        background: var(--past-bg);
      }

      .dt tr.row.soon {
        background: var(--soon-bg);
      }

      .dt tr.row.big {
        opacity: 1;
        background: var(--big-bg);
      }

      .dt tr.row.past td,
      .dt tr.row.soon td,
      .dt tr.row.big td {
        opacity: 1;
        background: transparent;
      }

      .dt tr.row.big .c-call,
      .dt tr.row.big td[data-l]::before {
        color: var(--text-main);
      }

      .c-time { grid-area: time; font-size: 1.45rem; }
      .c-vessel { grid-area: vessel; font-size: 1.1rem; }
      .c-route { grid-area: route; font-size: 0.95rem; line-height: 1.3; }
      .c-pilot { grid-area: pilot; }
      .c-call { grid-area: call; }
      .c-agent { grid-area: agent; }
      .c-ton { grid-area: ton; text-align: left; }

      .rt-from,
      .rt-to {
        display: block;
      }

      .dt td[data-l]::before {
        content: attr(data-l);
        display: block;
        font-size: 0.66rem;
        font-weight: 700;
        color: var(--text-muted);
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚓ 통합 도선 스케줄</h1>
      <div class="header-right">
        <span class="update-info" id="lastUpdated">업데이트: 불러오는 중...</span>
        <button class="refresh-btn" id="refreshBtn" type="button">🔄 새로고침</button>
        <button class="refresh-btn" id="themeBtn" type="button">🌓 자동</button>
      </div>
    </header>

    <div class="error-banner" id="errorBanner"></div>

    <div class="controls">
      <div class="tabs" id="portTabs">
        <button class="tab-btn active" data-port="SUMMARY">요약</button>
        <button class="tab-btn" data-port="DAESAN">대산</button>
        <button class="tab-btn" data-port="BORYEONG">보령</button>
        <button class="tab-btn" data-port="ALL">전체</button>
      </div>
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="선명, 콜사인, 도선점, 도선사, 대리점 검색..."
        />
      </div>
    </div>

    <!-- 대산 / 보령 / 전체 -->
    <div class="detail-wrap" id="detailWrap"></div>

    <!-- 요약 -->
    <div class="summary-note" id="summaryNote">
      대산은 전체 표시 / 평택은 JANG→, IPA→ 로 시작 / 인천은 JANG, PAL, NPPS 로 시작하는 도선점만 표시합니다. (인천·평택은 출발지(도선점)와 총톤수만 표시)
      <br>붉은 배경: 대산 15만톤 이상 / 보라색 표시: 통과선박 / 대산 선박을 누르면 상세정보가 나옵니다.
    </div>
    <div class="summary-grid" id="summaryWrap"></div>
  </div>

  <!-- 상세정보 창 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet" id="modalSheet"></div>
  </div>

  <script>
    // ===== 요약 화면 표시 규칙 =====
    // 항구별로 도선점이 아래 글자로 "시작"하는 선박만 요약에 표시합니다.
    // 규칙이 없는 항구(대산)는 전부 표시합니다. 영문 대소문자와 띄어쓰기는 무시합니다.
    const SUMMARY_RULES = {
      "평택": ["JANG→", "IPA→"],
      "인천": ["JANG", "PAL", "NPPS"]
    };

    // ===== 요약 화면에서 총톤수를 함께 보여줄 항구 =====
    const SUMMARY_TONNAGE_PORTS = ["인천", "평택", "대산"];

    // ===== 보령 표시 규칙 =====
    // 대산 스케줄 중 도선점의 출발지 또는 도착지가 아래 글자로 시작하면 보령으로 분류합니다.
    const BORYEONG_PREFIXES = ["PS1", "B.", "MDB"];

    // ===== 대산 초대형 선박 기준 (총톤수, 이 값 이상이면 스케줄 배경색을 붉게 강조) =====
    const BIG_TONNAGE = 150000;

    // ===== 상세정보 창에 보여줄 항목 (이 순서대로, 대리점 다음에 표시) =====
    const DETAIL_LABELS = ["흘수", "전장", "접안", "연락처"];

    // ===== 상세정보 창의 조석표 그래프가 보여줄 날 =====
    // "vessel": 그 선박의 도선일 하루 / "today": 항상 오늘 하루
    const SHEET_CHART_DAY = "vessel";

    const TAB_INFO = {
      DAESAN: { label: "대산", cls: "dt-title-daesan", note: "대산 도선예보 전체 (취소 제외)" },
      BORYEONG: { label: "보령", cls: "dt-title-boryeong", note: "대산 스케줄 중 도선점의 출발지나 도착지가 PS1, B., MDB 로 시작하는 선박" },
      ALL: { label: "전체", cls: "dt-title-all", note: "인천·평택·대산 전체 (평택은 도선사, 대리점, 톤수 정보 준비 중)" }
    };

    let currentPort = "SUMMARY";
    let searchKeyword = "";
    let allSchedules = [];
    let rowRefs = [];
    const TIDE_PORT_NAMES = { DAESAN: "대산항", BORYEONG: "보령항" };
    const LOW_TIDE_WINDOW_MIN = 2 * 60;
    let tidePoints = { DAESAN: [], BORYEONG: [] };
    const tideOpen = { DAESAN: false, BORYEONG: false };

    const detailWrap = document.getElementById("detailWrap");
    const summaryWrap = document.getElementById("summaryWrap");
    const summaryNote = document.getElementById("summaryNote");
    const lastUpdatedEl = document.getElementById("lastUpdated");
    const errorBanner = document.getElementById("errorBanner");
    const searchInput = document.getElementById("searchInput");
    const tabButtons = document.querySelectorAll(".tab-btn");
    const modalOverlay = document.getElementById("modalOverlay");
    const modalSheet = document.getElementById("modalSheet");

    // ===== 화면 모드 (자동 / 라이트 / 다크) =====
    const THEME_KEY = "pilot-theme";
    const THEME_LABEL = { auto: "🌓 자동", light: "☀️ 라이트", dark: "🌙 다크" };
    const themeBtn = document.getElementById("themeBtn");

    function readThemePref() {
      try {
        const v = localStorage.getItem(THEME_KEY);
        if (v === "light" || v === "dark") return v;
      } catch (e) {}
      return "auto";
    }
    let themePref = readThemePref();

    function applyTheme() {
      const sysDark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      const dark = themePref === "dark" || (themePref === "auto" && sysDark);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      const meta = document.querySelector("meta[name=theme-color]");
      if (meta) meta.setAttribute("content", dark ? "#0b1220" : "#1d4ed8");
      themeBtn.textContent = THEME_LABEL[themePref];
    }

    themeBtn.addEventListener("click", function () {
      const order = ["auto", "light", "dark"];
      themePref = order[(order.indexOf(themePref) + 1) % order.length];
      try {
        if (themePref === "auto") localStorage.removeItem(THEME_KEY);
        else localStorage.setItem(THEME_KEY, themePref);
      } catch (e) {}
      applyTheme();
    });

    if (window.matchMedia) {
      const mq = window.matchMedia("(prefers-color-scheme: dark)");
      const onSysChange = function () { if (themePref === "auto") applyTheme(); };
      if (mq.addEventListener) mq.addEventListener("change", onSysChange);
      else if (mq.addListener) mq.addListener(onSysChange);
    }
    applyTheme();

    function isNarrow() {
      return window.matchMedia("(max-width: 700px)").matches;
    }
    let lastNarrow = isNarrow();

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function val(v) {
      return v && v !== "-" ? esc(v) : "-";
    }

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    // 대산 선박만 누르면 상세정보가 뜨도록 번호표(data-ref)를 붙임
    function refAttr(item) {
      if (item.port !== "대산") return "";
      rowRefs.push(item);
      return " data-ref='" + (rowRefs.length - 1) + "'";
    }

    function parseScheduleTime(timeStr) {
      const now = new Date();
      const parts = timeStr.trim().split(" ");
      if (parts.length !== 2) return null;
      const md = parts[0];
      const hm = parts[1];
      const mdParts = md.split("-").map(Number);
      const hmParts = hm.split(":").map(Number);
      const month = mdParts[0];
      const day = mdParts[1];
      const hour = hmParts[0];
      const minute = hmParts[1];
      if (!month || !day || isNaN(hour) || isNaN(minute)) return null;

      let year = now.getFullYear();
      if (now.getMonth() === 11 && month === 1) year += 1;
      return new Date(year, month - 1, day, hour, minute, 0);
    }

    // 총톤수 숫자로 바꾸기 ("152,003" -> 152003)
    function tonNum(item) {
      return Number(String(item.tonnage || "").replace(/[^0-9.]/g, "")) || 0;
    }

    // 대산 15만톤 이상인지
    function isBig(item) {
      return item.port === "대산" && tonNum(item) >= BIG_TONNAGE;
    }

    // 대산 통과선박인지
    function isTransit(item) {
      return item.port === "대산" && item.transit === true;
    }

    function transitBadge(item) {
      return isTransit(item) ? "<div class='transit-badge'>통과선박</div>" : "";
    }

    // 도선점 표시 (A → B 는 두 줄로 나눠서 폰에서 보기 편하게)
    function routeHtml(st) {
      const s = String(st || "");
      if (s.indexOf("→") === -1) return esc(s);
      const parts = s.split("→");
      return (
        "<span class='rt-from'>" + esc(parts[0].trim()) + "</span> " +
        "<span class='rt-to'>→ " + esc(parts.slice(1).join("→").trim()) + "</span>"
      );
    }

    // 요약 화면: 인천·평택은 출발지(도선점)만, 대산은 그대로
    function sumStation(item) {
      const s = String(item.station || "");
      if (item.port === "평택") return s.split("→")[0].trim();
      if (item.port === "인천") return s.split(/\s+-\s+/)[0].trim();
      return s;
    }

    // 요약 화면: 총톤수 글자 (없으면 빈 글자)
    function sumTon(item) {
      if (SUMMARY_TONNAGE_PORTS.indexOf(item.port) === -1) return "";
      if (!item.tonnage || item.tonnage === "-") return "";
      return item.tonnage + "톤";
    }

    // 요약 화면에 보여줄 선박인지 판단
    function matchesSummaryRule(item) {
      const rules = SUMMARY_RULES[item.port];
      if (!rules) return true;
      const st = String(item.station || "").toUpperCase().replace(/\s+/g, "");
      return rules.some(function (prefix) {
        return st.indexOf(prefix.toUpperCase().replace(/\s+/g, "")) === 0;
      });
    }

    // 보령 선박인지 판단 (출발지 또는 도착지가 보령 규칙으로 시작)
    function isBoryeong(item) {
      if (item.port !== "대산") return false;
      const parts = String(item.station || "").split("→");
      return parts.some(function (p) {
        const s = p.trim().toUpperCase();
        return BORYEONG_PREFIXES.some(function (pre) {
          return s.indexOf(pre.toUpperCase()) === 0;
        });
      });
    }

    function matchesTab(item, tab) {
      if (tab === "ALL") return true;
      if (tab === "DAESAN") return item.port === "대산";
      if (tab === "BORYEONG") return isBoryeong(item);
      return item.port === tab;
    }

    function shortTime(timeStr) {
      const parts = String(timeStr).trim().split(" ");
      if (parts.length !== 2) return timeStr;
      const now = new Date();
      const todayMd = pad2(now.getMonth() + 1) + "-" + pad2(now.getDate());
      return parts[0] === todayMd ? parts[1] : parts[0] + " " + parts[1];
    }

    function getFiltered(tab) {
      const now = new Date();
      const oneHourAgo = new Date(now.getTime() - 60 * 60 * 1000);
      const limit = new Date(now.getTime() + 24 * 60 * 60 * 1000);
      const keyword = searchKeyword.toLowerCase();

      return allSchedules.filter(function (item) {
        const itemDate = parseScheduleTime(item.time);
        if (itemDate && itemDate < oneHourAgo) return false;
        if (itemDate && itemDate > limit) return false;

        if (!matchesTab(item, tab)) return false;

        return (
          !keyword ||
          (item.vessel && item.vessel.toLowerCase().includes(keyword)) ||
          (item.callSign && item.callSign.toLowerCase().includes(keyword)) ||
          (item.station && item.station.toLowerCase().includes(keyword)) ||
          (item.pilot && item.pilot.toLowerCase().includes(keyword)) ||
          (item.agent && item.agent.toLowerCase().includes(keyword))
        );
      });
    }

    // 원본 사이트 수집 실패 표시 (data.errors)
    function renderErrors(errorsMap) {
      const ports = Object.keys(errorsMap || {});
      if (ports.length === 0) {
        errorBanner.style.display = "none";
        errorBanner.innerHTML = "";
        return;
      }

      const names = ports
        .map(function (port) {
          const hasRows = allSchedules.some(function (s) {
            return s.port === port;
          });
          return port + (hasRows ? " (직전 정상 데이터 표시 중)" : "");
        })
        .join(", ");

      const details = ports
        .map(function (port) {
          return port + ": " + esc(errorsMap[port]);
        })
        .join(" · ");

      errorBanner.innerHTML =
        "⚠️ 원본 사이트 오류: " +
        esc(names) +
        "<span class='eb-detail'>" +
        esc(details) +
        "</span>";
      errorBanner.style.display = "block";
    }

    async function init() {
      let errorsMap = {};
      try {
        const res = await fetch("./data.json?t=" + new Date().getTime());
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        allSchedules = data.schedules || [];
        errorsMap = data.errors || {};
        lastUpdatedEl.textContent = "업데이트: " + (data.updatedAt || "-") + " (1시간 전~24시간 후 표시)";
      } catch (e) {
        console.error("데이터 로드 실패:", e);
        lastUpdatedEl.textContent = "업데이트: 데이터 로드 실패";
        allSchedules = [];
      }

      await loadTide();

      allSchedules.sort(function (a, b) {
        return a.time.localeCompare(b.time);
      });
      renderErrors(errorsMap);
      renderTable();
    }

    // =====================================================================
    // 항만별 조석표: 기존 tide-daesan.json의 대산항 형식은 유지하고 보령항을 별도로 읽습니다.
    function parseTidePoints(raw) {
      const days = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.days) ? raw.days : [raw]);
      const byTime = new Map();
      days.forEach(function (d) {
        if (!d || !/^\d{4}-\d{2}-\d{2}$/.test(d.date) || !Array.isArray(d.points)) return;
        const dp = d.date.split("-").map(Number);
        d.points.forEach(function (p) {
          const m = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(String((p && p.time) || ""));
          if (!m || !p || p.h == null || p.h === "") return;
          const h = Number(p.h);
          if (!Number.isFinite(h)) return;
          const t = Date.UTC(dp[0], dp[1] - 1, dp[2], Number(m[1]), Number(m[2])) / 60000;
          byTime.set(t, h);
        });
      });
      const points = [...byTime.keys()].sort(function (a, b) { return a - b; }).map(function (t) {
        return { t: t, h: byTime.get(t), type: "L" };
      });
      points.forEach(function (p, i) {
        const ref = i > 0 ? points[i - 1] : points[i + 1];
        p.type = ref && p.h > ref.h ? "H" : "L";
      });
      return points;
    }

    async function loadTide() {
      tidePoints = { DAESAN: [], BORYEONG: [] };
      try {
        const res = await fetch("./tide-daesan.json?t=" + new Date().getTime());
        if (!res.ok) throw new Error("HTTP " + res.status);
        const raw = await res.json();
        tidePoints.DAESAN = parseTidePoints(raw);
        tidePoints.BORYEONG = parseTidePoints(raw && raw.boryeong);
      } catch (e) {
        console.warn("조석 데이터 로드 실패:", e);
      }
    }

    // 서울 시각 (기기 시간대와 상관없이 항상 Asia/Seoul)
    function seoulNow() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Seoul",
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hourCycle: "h23"
      }).formatToParts(new Date());
      const g = {};
      parts.forEach(function (p) { g[p.type] = p.value; });
      const hh = Number(g.hour) % 24;
      const mm = Number(g.minute);
      return {
        date: g.year + "-" + g.month + "-" + g.day,
        hh: hh,
        mm: mm,
        abs: Date.UTC(Number(g.year), Number(g.month) - 1, Number(g.day), hh, mm) / 60000
      };
    }

    // 분 단위 절대시각(서울 시계 기준) -> 글자
    function dateOf(t) { return new Date(t * 60000).toISOString().slice(0, 10); }
    function hmOf(t) { return new Date(t * 60000).toISOString().slice(11, 16); }

    // 선박 도선시간("11-22 11:00") -> 절대시각
    function vesselAbs(timeStr, nowDate) {
      const m = /^(\d{2})-(\d{2}) (\d{2}):(\d{2})$/.exec(String(timeStr).trim());
      if (!m) return null;
      let y = Number(nowDate.slice(0, 4));
      const nm = Number(nowDate.slice(5, 7));
      const vm = Number(m[1]);
      if (nm === 12 && vm === 1) y += 1;
      else if (nm === 1 && vm === 12) y -= 1;
      return Date.UTC(y, vm - 1, Number(m[2]), Number(m[3]), Number(m[4])) / 60000;
    }

    // 만조·간조 두 점 사이 코사인 보간 (범위 밖이면 null)
    function tideAt(t, P) {
      if (P.length < 2) return null;
      if (t < P[0].t || t > P[P.length - 1].t) return null;
      for (let i = 0; i < P.length - 1; i++) {
        const a = P[i];
        const b = P[i + 1];
        if (t >= a.t && t <= b.t) {
          const r = (t - a.t) / (b.t - a.t);
          return a.h + (b.h - a.h) * (1 - Math.cos(Math.PI * r)) / 2;
        }
      }
      return null;
    }

    function tideInfo(nowT, P) {
      const cur = tideAt(nowT, P);
      let rising = null;
      if (cur !== null) {
        for (let i = 0; i < P.length - 1; i++) {
          if (nowT >= P[i].t && nowT <= P[i + 1].t) {
            rising = P[i + 1].h > P[i].h;
            break;
          }
        }
      }
      const fut = P.filter(function (p) { return p.t > nowT; });
      return {
        cur: cur,
        rising: rising,
        next: fut[0] || null,
        nextH: fut.find(function (p) { return p.type === "H"; }) || null,
        nextL: fut.find(function (p) { return p.type === "L"; }) || null
      };
    }

    function fmtRemain(m) {
      m = Math.max(0, Math.round(m));
      const h = Math.floor(m / 60);
      const mm = m % 60;
      return h > 0 ? h + "시간 " + mm + "분 후" : mm + "분 후";
    }

    function dayPrefix(t, nowAbs) {
      const d = dateOf(t);
      if (d === dateOf(nowAbs)) return "";
      if (d === dateOf(nowAbs + 1440)) return "내일 ";
      return d.slice(5) + " ";
    }

    function pointText(p, nowAbs) {
      return (p.type === "H" ? "만조" : "간조") + " " + dayPrefix(p.t, nowAbs) + hmOf(p.t) + " " + p.h + "cm";
    }

    // 한 줄 요약: 현재 ○○cm ↑상승(창조) · 다음 만조 14:39 707cm  (상승/하강 글자만 빨간색)
    function tideChipHtml(port) {
      const P = tidePoints[port];
      if (P.length < 2) return "조석 데이터 없음";
      const now = seoulNow();
      const info = tideInfo(now.abs, P);
      if (info.cur === null) return "현재 조석 높이: 조석 데이터 범위 밖";
      let s = "현재 " + Math.round(info.cur) + "cm <span class='tc-red'>" +
        (info.rising ? "↑상승(창조)" : "↓하강(낙조)") + "</span>";
      if (info.next) s += " · 다음 " + pointText(info.next, now.abs);
      return s;
    }

    // 간조 시각 앞뒤 2시간. 그래프와 도선시간 경고가 같은 기준을 사용합니다.
    function lowTideWindows(points) {
      if (points.length < 2) return [];
      return points.filter(function (p) { return p.type === "L"; }).map(function (p) {
        return [p.t - LOW_TIDE_WINDOW_MIN, p.t + LOW_TIDE_WINDOW_MIN];
      });
    }

    function isLowTideTime(t, points) {
      return lowTideWindows(points).some(function (window) { return window[0] <= t && t <= window[1]; });
    }

    // 그래프 (의존성 없는 SVG). W: 가로(px), H: 세로(px), day0: 그 날 00:00 절대시각
    function tideSvg(W, H, day0, nowT, vT, port, showLowTideBands) {
      const P = tidePoints[port];
      const L = 36, R = 12, T = 44, B = 30;
      const pw = W - L - R;
      const ph = H - T - B;
      const end = day0 + 1440;
      const X = function (t) { return L + (t - day0) / 1440 * pw; };
      const dayHeights = P.filter(function (p) { return p.t >= day0 && p.t <= end; })
        .map(function (p) { return p.h; });
      [tideAt(day0, P), tideAt(end, P)].forEach(function (h) { if (h !== null) dayHeights.push(h); });
      const yMin = Math.floor(Math.min(0, ...dayHeights) / 200) * 200;
      const yMax = Math.ceil(Math.max(800, ...dayHeights) / 200) * 200;
      const Y = function (h) { return T + ph - (h - yMin) / (yMax - yMin) * ph; };
      const f1 = function (n) { return n.toFixed(1); };

      let s = "<svg class='tc-svg' width='" + W + "' height='" + H + "' viewBox='0 0 " + W + " " + H +
        "' role='img' aria-label='" + TIDE_PORT_NAMES[port] + " 조석표 곡선'>";

      // 그래프 영역과 겹치는 부분만, 눈금과 곡선보다 먼저 그려 배경으로 둡니다.
      if (showLowTideBands) {
        lowTideWindows(P).forEach(function (window) {
          const start = Math.max(day0, window[0]);
          const stop = Math.min(end, window[1]);
          if (stop <= start) return;
          const left = X(start);
          const width = X(stop) - left;
          s += "<g><title>저수심±2h</title><rect class='tc-low-window' x='" + f1(left) + "' y='" + T +
            "' width='" + f1(width) + "' height='" + ph + "'/>";
          // 자정에 잘린 좁은 띠에도 가능한 한 글씨를 띠 안에 둡니다.
          if (width >= 25) {
            const length = width < 42 ? " textLength='" + f1(width - 4) + "' lengthAdjust='spacingAndGlyphs'" : "";
            s += "<text class='tc-low-window-label' x='" + f1(left + width / 2) + "' y='" + (T + 11) +
              "' text-anchor='middle'" + length + ">저수심±2h</text>";
          }
          s += "</g>";
        });
      }

      // 기본 눈금 밖의 조고도 자르지 않고 표시합니다.
      const tick = Math.max(200, Math.ceil((yMax - yMin) / 1200) * 200);
      for (let v = yMin; v <= yMax; v += tick) {
        s += "<line class='tc-grid' x1='" + L + "' x2='" + (W - R) + "' y1='" + f1(Y(v)) + "' y2='" + f1(Y(v)) + "'/>";
        s += "<text class='tc-ax' x='" + (L - 6) + "' y='" + f1(Y(v) + 4) + "' text-anchor='end'>" + v + "</text>";
      }
      // 세로 눈금 (3시간)
      for (let hh = 0; hh <= 24; hh += 3) {
        const x = X(day0 + hh * 60);
        s += "<line class='tc-vgrid' x1='" + f1(x) + "' x2='" + f1(x) + "' y1='" + T + "' y2='" + (T + ph) + "'/>";
        s += "<text class='tc-ax' x='" + f1(x) + "' y='" + (H - 7) + "' text-anchor='middle'>" + pad2(hh) + "</text>";
      }

      // 곡선 (10분 간격 + 만조/간조 지점)
      const ts = [];
      for (let t = day0; t <= end; t += 10) ts.push(t);
      P.forEach(function (p) { if (p.t >= day0 && p.t <= end) ts.push(p.t); });
      ts.sort(function (a, b) { return a - b; });
      let d = "";
      let pen = false;
      let last = null;
      ts.forEach(function (t) {
        if (t === last) return;
        last = t;
        const h = tideAt(t, P);
        if (h === null) { pen = false; return; }
        d += (pen ? "L" : "M") + f1(X(t)) + " " + f1(Y(h));
        pen = true;
      });
      if (d) s += "<path class='tc-curve' d='" + d + "'/>";

      // 만조·간조 점, 값, 시각 (값은 점 바로 옆, 시각은 그 바깥쪽 줄)
      P.forEach(function (p) {
        if (p.t < day0 || p.t > end) return;
        const x = X(p.t);
        const y = Y(p.h);
        const anchor = x < L + 26 ? "start" : (x > W - R - 26 ? "end" : "middle");
        const high = p.type === "H";
        const below = !high && (y + 28 <= T + ph + 24);
        const vy = (high || !below) ? y - 8 : y + 16;
        const ty = (high || !below) ? y - 20 : y + 28;
        s += "<circle class='tc-dot' cx='" + f1(x) + "' cy='" + f1(y) + "' r='4'/>";
        s += "<text class='tc-val' x='" + f1(x) + "' y='" + f1(vy) + "' text-anchor='" + anchor + "'>" + p.h + "</text>";
        s += "<text class='tc-ptime' x='" + f1(x) + "' y='" + f1(ty) + "' text-anchor='" + anchor + "'>" + (high ? "만조 " : "간조 ") + hmOf(p.t) + "</text>";
      });

      // 현재 시각 / 선박 도선시간 세로선
      const nowIn = nowT !== null && nowT >= day0 && nowT <= end;
      const vesIn = vT !== null && vT >= day0 && vT <= end && tideAt(vT, P) !== null;
      const xn = nowIn ? X(nowT) : null;
      const xv = vesIn ? X(vT) : null;
      let ancN = "middle";
      let ancV = "middle";
      if (xn !== null && xv !== null && Math.abs(xn - xv) < 80) {
        if (xn <= xv) { ancN = "end"; ancV = "start"; } else { ancN = "start"; ancV = "end"; }
      } else {
        if (xn !== null) ancN = xn < L + 40 ? "start" : (xn > W - R - 40 ? "end" : "middle");
        if (xv !== null) ancV = xv < L + 40 ? "start" : (xv > W - R - 40 ? "end" : "middle");
      }

      if (vesIn) {
        const hv = tideAt(vT, P);
        const yv = Y(hv);
        s += "<line class='tc-ves-line' x1='" + f1(xv) + "' x2='" + f1(xv) + "' y1='" + (T - 16) + "' y2='" + (T + ph) + "'/>";
        s += "<polygon class='tc-ves-mark' points='" + f1(xv) + "," + f1(yv - 7) + " " + f1(xv + 7) + "," + f1(yv) + " " + f1(xv) + "," + f1(yv + 7) + " " + f1(xv - 7) + "," + f1(yv) + "'/>";
        s += "<text class='tc-ves-lbl' x='" + f1(xv + (ancV === "start" ? 3 : ancV === "end" ? -3 : 0)) + "' y='12' text-anchor='" + ancV + "'>도선 " + hmOf(vT) + "</text>";
      }
      if (nowIn) {
        const hn = tideAt(nowT, P);
        s += "<line class='tc-now-line' x1='" + f1(xn) + "' x2='" + f1(xn) + "' y1='" + (T - 16) + "' y2='" + (T + ph) + "'/>";
        if (hn !== null) s += "<circle class='tc-now-dot' cx='" + f1(xn) + "' cy='" + f1(Y(hn)) + "' r='5'/>";
        s += "<text class='tc-now-lbl' x='" + f1(xn + (ancN === "start" ? 3 : ancN === "end" ? -3 : 0)) + "' y='12' text-anchor='" + ancN + "'>현재 " + (hn !== null ? Math.round(hn) + "cm" : "") + "</text>";
      }

      s += "</svg>";
      return s;
    }

    // 조석표 카드 채우기 (data-mode: full = 목록 펼침용 / compact = 상세정보 창용)
    function fillTideBox(box) {
      const mode = box.getAttribute("data-mode");
      const vesselStr = box.getAttribute("data-vessel") || "";
      const port = box.dataset.tidePort;
      const name = TIDE_PORT_NAMES[port];
      const P = tidePoints[port];
      const now = seoulNow();
      const info = tideInfo(now.abs, P);
      const vT = vesselStr ? vesselAbs(vesselStr, now.date) : null;

      let dayStr = now.date;
      if (mode === "compact" && SHEET_CHART_DAY === "vessel" && vT !== null) dayStr = dateOf(vT);
      const dp = dayStr.split("-").map(Number);
      const day0 = Date.UTC(dp[0], dp[1] - 1, dp[2]) / 60000;
      const H = mode === "full" ? 270 : 200;

      const compact = mode === "compact";
      const trendBadge = compact && info.rising !== null
        ? "<span class='tc-state-badge'>" + (info.rising ? "↑ 상승(창조)" : "↓ 하강(낙조)") + "</span>"
        : "";
      let html = "<div class='tc-title'>" + name + " 조석표" + trendBadge + "</div>";
      let vesselTideCaption = "";

      if (mode === "full") {
        const hhmm = pad2(now.hh) + ":" + pad2(now.mm);
        const big = info.cur === null
          ? "<div class='tc-big tc-big-na'>범위 밖</div>"
          : "<div class='tc-big'>" + Math.round(info.cur) + "<small>cm</small></div>";
        const state = info.rising === null ? "-" : (info.rising ? "↑ 상승(창조)" : "↓ 하강(낙조)");
        const nexts = [info.nextH, info.nextL].filter(Boolean).sort(function (a, b) { return a.t - b.t; });
        let nextHtml = "";
        nexts.forEach(function (p) {
          nextHtml += "<div class='tc-next'>다음 " + (p.type === "H" ? "만조" : "간조") + " " +
            dayPrefix(p.t, now.abs) + hmOf(p.t) + "<br><span>" + p.h + "cm · " + fmtRemain(p.t - now.abs) + "</span></div>";
        });
        if (!nextHtml) nextHtml = "<div class='tc-next'><span>다음 만조·간조 정보 없음</span></div>";
        html +=
          "<div class='tc-two'>" +
            "<div class='tc-sum'><div class='tc-l'>현재 시각 · 서울</div><div class='tc-time'>" + hhmm + "</div>" + big + "</div>" +
            "<div class='tc-sum'><div class='tc-l'>조류 상태</div><div class='tc-state tc-red'>" + state + "</div>" + nextHtml + "</div>" +
          "</div>";
      } else if (vT !== null && vT >= day0 && vT <= day0 + 1440) {
        const vh = tideAt(vT, P);
        const caution = isLowTideTime(vT, P);
        if (vh !== null || caution) {
          vesselTideCaption = "<div class='tc-ves-text'>도선시간 " + (dateOf(vT) !== now.date ? dateOf(vT).slice(5) + " " : "") +
            hmOf(vT) + (vh !== null ? " 예상 조석 높이 약 " + Math.round(vh) + "cm" : "") +
            (caution ? "<span class='tc-low-badge'>저수심 주의</span>" : "") + "</div>";
        }
      }

      html += "<div class='tc-chart' style='height:" + H + "px'></div>";
      html += vesselTideCaption;
      html += "<div class='tc-foot'>" + name + " " + esc(dayStr) + " · 점 사이는 보간한 근사값(참고용)</div>";
      box.innerHTML = html;

      const holder = box.querySelector(".tc-chart");
      const w = holder ? holder.clientWidth : 0;
      const hasData = P.length >= 2 && P[0].t <= day0 + 1440 && P[P.length - 1].t >= day0;
      if (holder && !hasData) {
        holder.innerHTML = "<div class='tc-empty' style='height:" + H + "px'>이 날짜의 " + name + " 조석 데이터가 없습니다</div>";
      } else if (w > 0) {
        holder.innerHTML = tideSvg(w, H, day0, now.abs, vT, port, compact);
      }
    }

    function renderTideBoxes() {
      document.querySelectorAll(".js-tide-box").forEach(function (box) {
        if (box.offsetWidth > 0) fillTideBox(box);
      });
    }

    function refreshTide() {
      document.querySelectorAll(".js-tide-chip").forEach(function (el) {
        el.innerHTML = tideChipHtml(el.dataset.tidePort);
      });
      renderTideBoxes();
    }

    // 목록 화면: "대산 24건" 바 아래 한 줄 요약 + 펼침 그래프
    function tideBarHtml(port) {
      const name = TIDE_PORT_NAMES[port];
      if (tidePoints[port].length < 2) {
        return "<div class='tide-bar tide-bar-off'>" + name + " 조석표: 조석 데이터 없음</div>";
      }
      return (
        "<div class='tide-bar' data-tide-toggle='1' data-tide-port='" + port + "' role='button'>" +
          "<span class='tide-bar-t'>" + name + " 조석표</span>" +
          "<span class='tide-bar-chip js-tide-chip' data-tide-port='" + port + "'>" + tideChipHtml(port) + "</span>" +
          "<span class='tide-bar-arrow'>" + (tideOpen[port] ? "▲" : "▼") + "</span>" +
        "</div>" +
        "<div class='tide-panel' id='tidePanel' style='display:" + (tideOpen[port] ? "block" : "none") + "'>" +
          "<div class='tide-card js-tide-box' data-mode='full' data-tide-port='" + port + "'></div>" +
        "</div>"
      );
    }

    function toggleTide(port) {
      tideOpen[port] = !tideOpen[port];
      const panel = document.getElementById("tidePanel");
      const arrow = document.querySelector(".tide-bar-arrow");
      if (panel) panel.style.display = tideOpen[port] ? "block" : "none";
      if (arrow) arrow.textContent = tideOpen[port] ? "▲" : "▼";
      if (tideOpen[port]) renderTideBoxes();
    }

    // ===== 요약: 컴퓨터용 (3칸 나란히) =====
    function renderSummaryColumns() {
      const ports = ["인천", "평택", "대산"];
      summaryWrap.innerHTML = ports
        .map(function (port) {
          const items = getFiltered(port).filter(matchesSummaryRule);
          let body = "";
          if (items.length === 0) {
            body = "<div class='sum-empty'>표시할 스케줄이 없습니다.</div>";
          } else {
            body = items
              .map(function (item) {
                const ton = sumTon(item);
                return (
                  "<div class='sum-item" + (isBig(item) ? " big" : "") + "'" + refAttr(item) + ">" +
                    "<div class='sum-line1'>" +
                      "<span class='sum-vessel'>" + esc(item.vessel) + "</span>" +
                      "<span class='sum-time'>" + esc(shortTime(item.time)) + "</span>" +
                    "</div>" +
                    transitBadge(item) +
                    "<div class='sum-station'>" + esc(sumStation(item)) +
                      (ton ? " · <span class='sum-ton'>" + esc(ton) + "</span>" : "") +
                    "</div>" +
                  "</div>"
                );
              })
              .join("");
          }
          return (
            "<div class='sum-col'>" +
              "<div class='sum-head sum-head-" + port + "'>" + port + "<small>" + items.length + "건</small></div>" +
              body +
            "</div>"
          );
        })
        .join("");
    }

    // ===== 요약: 폰용 (시간대별 표, 가로 = 항구) =====
    function renderSummaryTimeline() {
      const ports = ["인천", "평택", "대산"];
      const now = new Date();
      const tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);
      const todayMd = pad2(now.getMonth() + 1) + "-" + pad2(now.getDate());
      const tomorrowMd = pad2(tomorrow.getMonth() + 1) + "-" + pad2(tomorrow.getDate());

      const counts = {};
      const groups = {};
      const order = [];

      ports.forEach(function (port) {
        const items = getFiltered(port).filter(matchesSummaryRule);
        counts[port] = items.length;
        items.forEach(function (item) {
          const parts = String(item.time).trim().split(" ");
          if (parts.length !== 2) return;
          const hm = parts[1].split(":");
          const key = parts[0] + " " + hm[0];
          if (!groups[key]) {
            groups[key] = { date: parts[0], hour: hm[0], cells: { "인천": [], "평택": [], "대산": [] } };
            order.push(key);
          }
          groups[key].cells[port].push({ item: item, min: hm[1] });
        });
      });

      order.sort();

      let html = "<div class='tl-grid'>";
      html += "<div class='tl-head tl-head-time'>시</div>";
      ports.forEach(function (port) {
        html += "<div class='tl-head sum-head-" + port + "'>" + port + "<small>" + counts[port] + "건</small></div>";
      });

      if (order.length === 0) {
        html += "<div class='tl-empty'>표시할 스케줄이 없습니다.</div>";
      }

      let lastDate = todayMd;
      order.forEach(function (key) {
        const g = groups[key];
        if (g.date !== lastDate) {
          html += "<div class='tl-date'>" + esc(g.date) + (g.date === tomorrowMd ? " (내일)" : "") + "</div>";
          lastDate = g.date;
        }
        html += "<div class='tl-hour'>" + esc(g.hour) + "시</div>";
        ports.forEach(function (port) {
          const list = g.cells[port];
          html += "<div class='tl-cell'>";
          list.forEach(function (c) {
            const ton = sumTon(c.item);
            html +=
              "<div class='tl-item" + (isBig(c.item) ? " big" : "") + "'" + refAttr(c.item) + ">" +
                "<div class='tl-min'>" + esc(c.min) + "분</div>" +
                "<div class='tl-name'>" + esc(c.item.vessel) + "</div>" +
                transitBadge(c.item) +
                "<div class='tl-st'>" + esc(sumStation(c.item)) + "</div>" +
                (ton ? "<div class='tl-ton'>" + esc(ton) + "</div>" : "") +
              "</div>";
          });
          html += "</div>";
        });
      });

      html += "</div>";
      summaryWrap.innerHTML = html;
    }

    function renderSummary() {
      if (isNarrow()) {
        renderSummaryTimeline();
      } else {
        renderSummaryColumns();
      }
    }

    // ===== 상세 목록 (대산 / 보령 / 전체) =====
    function renderDetail(tab) {
      const info = TAB_INFO[tab];
      const items = getFiltered(tab);
      const now = new Date();
      const soonLimit = new Date(now.getTime() + 60 * 60 * 1000);
      const tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);
      const todayMd = pad2(now.getMonth() + 1) + "-" + pad2(now.getDate());
      const tomorrowMd = pad2(tomorrow.getMonth() + 1) + "-" + pad2(tomorrow.getDate());

      let html =
        "<div class='dt-legend'>" + esc(info.note) +
        "<br>회색: 이미 지난 시간 / 노란색: 1시간 이내 / 붉은 배경: 대산 15만톤 이상 / 보라색 표시: 통과선박" +
        "<br>대산 선박을 누르면 상세정보가 나옵니다.</div>";
      html += "<div class='dt-card'>";
      html += "<div class='dt-title " + info.cls + "'>" + info.label + "<small>" + items.length + "건</small></div>";

      if (tab === "DAESAN" || tab === "BORYEONG") html += tideBarHtml(tab);

      if (items.length === 0) {
        html += "<div class='dt-empty'>현재 시각 기준 표시할 스케줄이 없습니다.</div></div>";
        detailWrap.innerHTML = html;
        return;
      }

      html += "<table class='dt'><thead><tr>" +
        "<th>도선사</th><th>선명</th><th>POB</th><th>도선점</th><th>콜사인</th><th>대리점</th><th class='num'>톤수</th>" +
        "</tr></thead><tbody>";

      let lastDate = null;
      items.forEach(function (item) {
        const parts = String(item.time).trim().split(" ");
        const date = parts[0];
        const hm = parts.length === 2 ? parts[1] : item.time;

        if (date !== lastDate) {
          let label = date;
          if (date === todayMd) label += " (오늘)";
          else if (date === tomorrowMd) label += " (내일)";
          html += "<tr class='date-row'><td colspan='7'>" + esc(label) + "</td></tr>";
          lastDate = date;
        }

        const d = parseScheduleTime(item.time);
        const big = isBig(item);
        let cls = "row p-" + item.port;
        if (d && d < now) cls += " past";
        else if (d && d <= soonLimit) cls += " soon";
        if (big) cls += " big";

        let badges = "";
        if (tab === "ALL") {
          badges += "<span class='badge badge-" + item.port + "'>" + esc(item.port) + "</span>";
          if (isBoryeong(item)) badges += "<span class='badge badge-보령'>보령</span>";
        }

        const tonCell = val(item.tonnage);

        html +=
          "<tr class='" + cls + "'" + refAttr(item) + ">" +
            "<td class='c-pilot' data-l='도선사'>" + val(item.pilot) + "</td>" +
            "<td class='c-vessel'>" + badges + esc(item.vessel) + "</td>" +
            "<td class='c-time'>" + esc(hm) + "</td>" +
            "<td class='c-route'>" + transitBadge(item) + routeHtml(item.station) + "</td>" +
            "<td class='c-call' data-l='콜사인'>" + val(item.callSign) + "</td>" +
            "<td class='c-agent' data-l='대리점'>" + val(item.agent) + "</td>" +
            "<td class='c-ton num' data-l='톤수'>" + tonCell + "</td>" +
          "</tr>";
      });

      html += "</tbody></table></div>";
      detailWrap.innerHTML = html;
    }

    function renderTable() {
      rowRefs = [];
      const isSummary = currentPort === "SUMMARY";

      detailWrap.style.display = isSummary ? "none" : "block";
      summaryWrap.style.display = isSummary ? "grid" : "none";
      summaryNote.style.display = isSummary ? "block" : "none";

      if (isSummary) {
        renderSummary();
        return;
      }

      renderDetail(currentPort);
      renderTideBoxes();
    }

    // ===== 상세정보 창 (대산 전용) =====
    function dmRow(label, html) {
      if (!html || html === "-") return "";
      return (
        "<div class='dm-row'>" +
          "<div class='dm-l'>" + esc(label) + "</div>" +
          "<div class='dm-v'>" + html + "</div>" +
        "</div>"
      );
    }

    function openDetail(item) {
      const now = new Date();
      const tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);
      const todayMd = pad2(now.getMonth() + 1) + "-" + pad2(now.getDate());
      const tomorrowMd = pad2(tomorrow.getMonth() + 1) + "-" + pad2(tomorrow.getDate());

      const parts = String(item.time).trim().split(" ");
      const date = parts.length === 2 ? parts[0] : "";
      const hm = parts.length === 2 ? parts[1] : item.time;

      let dateLabel = date;
      if (date === todayMd) dateLabel += " (오늘)";
      else if (date === tomorrowMd) dateLabel += " (내일)";

      let tags = "<span class='badge badge-" + item.port + "'>" + esc(item.port) + "</span>";
      if (isBoryeong(item)) tags += "<span class='badge badge-보령'>보령</span>";
      if (isTransit(item)) tags += "<div class='transit-badge'>통과선박</div>";

      // 공통: 대리점만 / 추가: 흘수, 전장, 접안, 연락처
      let rows = dmRow("대리점", val(item.agent));

      const map = {};
      (item.detail || []).forEach(function (pair) {
        if (pair && pair[0]) map[pair[0]] = pair[1];
      });
      DETAIL_LABELS.forEach(function (label) {
        if (map[label] && map[label] !== "-") {
          rows += dmRow(label, esc(map[label]));
        }
      });

      // 보령으로 분류된 선박은 어느 탭에서 열어도 보령항 조석표를 사용합니다.
      const tidePort = isBoryeong(item) ? "BORYEONG" : "DAESAN";
      const tideHtml = "<div class='dm-tide'><div class='tide-card js-tide-box' data-mode='compact' data-vessel='" +
        esc(item.time) + "' data-tide-port='" + tidePort + "'></div></div>";

      modalSheet.innerHTML =
        "<div class='dm-head'>" +
          "<div>" +
            "<div class='dm-title'>" + esc(item.vessel) + "</div>" +
            "<div class='dm-tags'>" + tags + "</div>" +
          "</div>" +
          "<button class='dm-close' id='dmClose' type='button' aria-label='닫기'>✕</button>" +
        "</div>" +
        "<div class='dm-key" + (isBig(item) ? " big" : "") + "'>" +
          "<div class='dm-date'>" + esc(dateLabel) + " 도선시간</div>" +
          "<div class='dm-time'>" + esc(hm) + "</div>" +
          "<div class='dm-route'>" + esc(item.station) + "</div>" +
        "</div>" +
        tideHtml +
        "<div class='dm-body'>" + rows + "</div>";

      modalOverlay.classList.add("open");
      document.body.style.overflow = "hidden";
      modalSheet.scrollTop = 0;
      renderTideBoxes();
    }

    function closeDetail() {
      modalOverlay.classList.remove("open");
      document.body.style.overflow = "";
    }

    document.addEventListener("click", function (e) {
      if (e.target.closest("#dmClose")) {
        closeDetail();
        return;
      }
      if (e.target === modalOverlay) {
        closeDetail();
        return;
      }
      const tideToggle = e.target.closest("[data-tide-toggle]");
      if (tideToggle) {
        toggleTide(tideToggle.dataset.tidePort);
        return;
      }

      const el = e.target.closest("[data-ref]");
      if (el) {
        const it = rowRefs[Number(el.getAttribute("data-ref"))];
        if (it) openDetail(it);
      }
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeDetail();
    });

    tabButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        tabButtons.forEach(function (b) {
          b.classList.remove("active");
        });
        btn.classList.add("active");
        currentPort = btn.dataset.port;
        renderTable();
      });
    });

    searchInput.addEventListener("input", function (e) {
      searchKeyword = e.target.value.trim();
      renderTable();
    });

    // 화면 폭이 좁음/넓음으로 바뀔 때만 다시 그리기 (폰 회전 등)
    window.addEventListener("resize", function () {
      const nowNarrow = isNarrow();
      if (nowNarrow !== lastNarrow) {
        lastNarrow = nowNarrow;
        if (currentPort === "SUMMARY") renderTable();
      }
    });

    // 화면 크기가 바뀌면 조석표 그래프 가로 길이를 다시 맞춤
    let tideResizeTimer = null;
    window.addEventListener("resize", function () {
      clearTimeout(tideResizeTimer);
      tideResizeTimer = setTimeout(renderTideBoxes, 150);
    });

    // 1분마다 조석표(현재 시각 기준) 갱신
    setInterval(refreshTide, 60000);

    const refreshBtn = document.getElementById("refreshBtn");
    refreshBtn.addEventListener("click", async function () {
      refreshBtn.disabled = true;
      lastUpdatedEl.textContent = "업데이트: 불러오는 중...";
      await init();
      refreshBtn.disabled = false;
    });

    init();
  </script>
</body>
</html>
